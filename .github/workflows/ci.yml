name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  validate:
    name: Build & Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint workspace
        run: npx ng lint

      - name: Build Library (@uncuyoapp/ngx-data-visualizer)
        run: npx ng build ngx-data-visualizer --configuration production

      - name: Build Demo Application
        run: npx ng build demo --configuration production
