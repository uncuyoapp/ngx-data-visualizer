<!-- Dashboard principal que ocupa el espacio disponible menos el nav -->
<div class="container dashboard-container pb-4">
  <!-- Dashboard con nuevo layout -->
  <div class="dashboard">
    <!-- Sección unificada de Gráficos Secundarios con Selector de Año Centrado -->
    <div class="secondary-charts-section p-3">
      <!-- Selector de año centrado horizontalmente -->
      <div class="year-selector-header d-flex justify-content-center mb-3">
        <div class="year-pills d-flex flex-wrap align-items-center justify-content-center gap-1">
          @for (year of availableYears; track year) {
          <button type="button" class="btn btn-sm year-pill-btn" [class.active]="selectedYear === year"
            (click)="selectYear(year)">
            {{ year }}
          </button>
          }
        </div>
      </div>

      <!-- Gráficos secundarios -->
      <div class="secondary-charts">
        <!-- Gráfico secundario 1 -->
        <div class="element one">
          <div class="chart">
            <libChart #chartOne [dataset]="datasetOne" [chartOptions]="chartOptionsOne"></libChart>
          </div>
          <p class="text-center my-1 text-muted">Condición</p>
        </div>

        <!-- Gráfico secundario 2 -->
        <div class="element two">
          <div class="chart">
            <libChart #chartTwo [dataset]="datasetTwo" [chartOptions]="chartOptionsTwo"></libChart>
          </div>
          <p class="text-center my-1 text-muted">Sector de gestión</p>
        </div>

        <!-- Gráfico secundario 3 -->
        <div class="element three">
          <div class="chart">
            <libChart #chartThree [dataset]="datasetThree" [chartOptions]="chartOptionsThree"></libChart>
          </div>
          <p class="text-center my-1 text-muted">Sexo</p>
        </div>
      </div>
    </div>

    <!-- Gráfico principal - ocupa todo el ancho -->
    <div class="element four">
      <libChart #chartFull [dataset]="datasetFour" [chartOptions]="chartOptionsFour"></libChart>
    </div>

    <!-- Tabla principal - ocupa todo el ancho -->
    <div class="element five">
      <libTable #tableFull [dataset]="datasetFour" [tableOptions]="tableOptions"></libTable>
    </div>
  </div>
</div>

<!-- Panel lateral deslizante para controles adicionales -->
<div class="side-menu shadow-lg" [class.open]="isSidePanelOpen">
  <!-- Botón para cerrar el panel -->
  <div class="close-button" (click)="closeSidePanel()" (keydown.enter)="closeSidePanel()"
    (keydown.space)="closeSidePanel()" tabindex="0" role="button" aria-label="Cerrar panel">
    <span>&times;</span>
  </div>

  <div class="side-menu-content">
    <!-- Título del panel -->
    <h3 class="side-menu-title">Configuración Avanzada</h3>

    <!-- Sección de filtros avanzados -->
    <div class="filter-section my-4">
      <h4>Filtros</h4>

      <!-- Iteración sobre dimensiones para filtrado avanzado -->
      @for (dimension of dimensions; track dimension.id) {
      <div class="filter-group">
        <!-- Cabecera de dimensión -->
        <div class="dimension-header">
          <div class="form-check">
            <label class="form-check-label" [for]="'dimension' + dimension.id">
              {{ dimension.nameView }}
            </label>
          </div>

          <!-- Botón para expandir/colapsar -->
          <button class="toggle-button" (click)="toggleDimensionItems(dimension)" type="button">
            <span [innerHTML]="
                  isDimensionCollapsed(dimension.id.toString()) ? '→' : '↓'
                "></span>
          </button>
        </div>

        <!-- Lista de items de la dimensión -->
        <div class="dimension-items" [class.collapsed]="isDimensionCollapsed(dimension.id.toString())">
          <!-- Opción "Todos" -->
          <div class="form-check ms-4">
            <input type="checkbox" class="form-check-input" #allCheckbox [checked]="areAllItemsSelected(dimension)"
              [id]="'all' + dimension.id" (change)="
                  toggleAllItems(dimension, $any($event.target).checked)
                " />
            <label class="form-check-label fw-bold" [for]="'all' + dimension.id">
              Todos
            </label>
          </div>

          <!-- Items individuales -->
          @for (item of dimension.items; track item.id) {
          <div class="form-check ms-4">
            <input type="checkbox" class="form-check-input" [(ngModel)]="item.selected" [id]="'item' + item.id"
              (ngModelChange)="onItemChange()" />
            <label class="form-check-label" [for]="'item' + item.id">
              {{ item.name }}
            </label>
          </div>
          }
        </div>
      </div>
      }

      <!-- Botón para resetear filtros -->
      <button class="action-btn reset-btn w-100" (click)="clearFilters()">
        <span class="action-icon">🔄</span>
        <span class="action-text">Reestablecer filtros</span>
      </button>
    </div>
  </div>
</div>

<!-- Botón flotante para abrir el panel lateral -->
<!-- Solo se muestra cuando el panel está cerrado -->
<button class="floating-menu-button" (click)="toggleSidePanel()" *ngIf="!isSidePanelOpen">
  <span>☰</span>
</button>
