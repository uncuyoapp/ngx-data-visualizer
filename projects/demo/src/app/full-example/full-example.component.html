<div class="full-example-container p-4">
  <!-- Botón flotante para abrir el panel lateral de filtros -->
  <!-- Solo se muestra cuando el panel está cerrado -->
  <button class="floating-menu-button" (click)="toggleSidePanel()" *ngIf="!isSidePanelOpen"
    title="Filtros y configuración">
    <span>☰</span>
  </button>

  <!-- SECCIÓN PRINCIPAL: Gráfico principal con controles de exportación -->
  <section class="chart-section mb-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h2 class="h4 mb-0">Visualización Principal</h2>
      <div class="export-actions d-flex gap-2">
        <button type="button" class="btn btn-outline-primary btn-sm" (click)="togglePercentView(chartOne)">
          {{ isPercentViewActive ? 'Ver Valores' : 'Ver Porcentajes' }}
        </button>
        <button type="button" class="btn btn-outline-secondary btn-sm" (click)="toggleGoal(chartOne)">
          {{ isGoalVisible ? 'Ocultar Meta' : 'Ver Meta' }}
        </button>
        <button type="button" class="btn btn-outline-info btn-sm" (click)="showDemoLegends = !showDemoLegends">
          {{ showDemoLegends ? 'Ocultar Leyendas' : 'Ver Leyendas' }}
        </button>
        <button type="button" class="btn btn-outline-dark btn-sm" (click)="showDemoEditor = !showDemoEditor">
          {{ showDemoEditor ? 'Cerrar Editor' : 'Configurar' }}
        </button>
        <button type="button" class="btn btn-primary btn-sm" (click)="exportChart(chartOne)">
          Descargar Gráfico
        </button>
      </div>
    </div>

    <!-- Componente de gráfico principal -->
    <div class="chart-container card shadow-sm p-3 mb-4">
      <h5 class="card-title text-muted small mb-2">Gráfico Original</h5>
      <libChart #chartOne="libChart" [dataset]="dataset" [(chartOptions)]="chartOptions" [(showEditor)]="showDemoEditor"
        [showLegends]="showDemoLegends" (seriesChange)="onSeriesChange($event)">
      </libChart>
    </div>
  </section>

  <!-- SECCIÓN DE DATOS: Tabla interactiva con exportación a Excel -->
  <section class="table-section mb-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h2 class="h4 mb-0">Tabla de Datos Detallada</h2>
      <div class="d-flex gap-2">
        <button type="button" class="btn btn-outline-dark btn-sm" (click)="showTableEditor = !showTableEditor">
          {{ showTableEditor ? 'Cerrar Editor' : 'Configurar Tabla' }}
        </button>
        <button type="button" class="btn btn-success btn-sm" (click)="exportTable(tableOne)">
          Exportar a Excel (.xlsx)
        </button>
      </div>
    </div>

    <!-- Componente de tabla pivot interactiva -->
    <div class="table-container card shadow-sm p-3 overflow-auto">
      <libTable #tableOne="libTable" [dataset]="dataset" [(tableOptions)]="tableOptions"
        [(showEditor)]="showTableEditor"></libTable>
    </div>
  </section>

  <!-- SECCIÓN AVANZADA: Múltiples gráficos segmentados por dimensión -->
  <section class="multi-chart-section mb-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h2 class="h4 mb-0">Comparativa por {{ splitDimension.name }}</h2>
      <div class="d-flex align-items-center gap-2">
        <label for="splitDimSelect" class="text-muted small">Dividir por:</label>
        <select id="splitDimSelect" class="form-select form-select-sm" [ngModel]="splitDimension.id"
          (ngModelChange)="onSplitDimensionChange($event)">
          <option *ngFor="let dim of dataset.dimensions" [value]="dim.id">{{ dim.name }}</option>
        </select>
      </div>
    </div>

    <!-- Componente que genera un gráfico por cada item de la dimensión seleccionada -->
    <div class="multi-charts-grid">
      <libMultipleChart [dataset]="dataset" [options]="chartOptions2" [splitDimension]="splitDimension">
      </libMultipleChart>
      <!-- PANEL LATERAL (SIDE MENU): Filtros y configuraciones -->
      <div class="side-menu shadow-lg" [class.open]="isSidePanelOpen">
        <!-- Botón para cerrar el panel -->
        <div class="close-button" (click)="closeSidePanel()" (keydown.enter)="closeSidePanel()"
          (keydown.space)="closeSidePanel()" tabindex="0" role="button" aria-label="Cerrar panel">
          <span>&times;</span>
        </div>

        <div class="side-menu-content">
          <!-- Título del panel -->
          <h3 class="side-menu-title">Configuración Avanzada</h3>

          <!-- Sección de filtros avanzados -->
          <div class="filter-section my-4">
            <h4>Filtros</h4>

            <!-- Iteración sobre dimensiones para filtrado avanzado -->
            <div *ngFor="let dimension of dataset.dimensions" class="filter-group">
              <!-- Cabecera de dimensión -->
              <div class="dimension-header">
                <div class="form-check">
                  <input type="checkbox" [(ngModel)]="dimension.selected" (change)="onDimensionChange(dimension)"
                    class="form-check-input" [id]="'dimension' + dimension.id" />
                  <label class="form-check-label" [for]="'dimension' + dimension.id">
                    {{ dimension.name }}
                  </label>
                </div>

                <!-- Botón para expandir/colapsar -->
                <button class="toggle-button" (click)="toggleDimensionItems(dimension)" type="button">
                  <span [innerHTML]="
                      isDimensionCollapsed(dimension.id.toString()) ? '→' : '↓'
                    "></span>
                </button>
              </div>

              <!-- Lista de items de la dimensión -->
              <div class="dimension-items" [class.collapsed]="isDimensionCollapsed(dimension.id.toString())">
                <!-- Opción "Todos" -->
                <div class="form-check ms-4">
                  <input type="checkbox" class="form-check-input" #allCheckbox
                    [checked]="areAllItemsSelected(dimension)" [id]="'all' + dimension.id" (change)="
                      toggleAllItems(dimension, $any($event.target).checked)
                    " />
                  <label class="form-check-label fw-bold" [for]="'all' + dimension.id">
                    Todos
                  </label>
                </div>

                <!-- Items individuales -->
                @for (item of dimension.items; track item.id) {
                <div class="form-check ms-4">
                  <input type="checkbox" class="form-check-input" [(ngModel)]="item.selected" [id]="'item' + item.id"
                    (ngModelChange)="onItemChange()" />
                  <label class="form-check-label" [for]="'item' + item.id">
                    {{ item.name }}
                  </label>
                </div>
                }
              </div>
            </div>

            <!-- Botón para resetear filtros -->
            <button class="action-btn reset-btn w-100" (click)="clearFilters()">
              <span class="action-icon">🔄</span>
              <span class="action-text">Reestablecer filtros</span>
            </button>
          </div>
        </div>
      </div>
    </div>
  </section>
</div>
