<div class="config-editor-container" cdkDrag>
  <div class="config-editor-header" cdkDragHandle>
    <div class="drag-handle">
      <div class="header-title">
        <span>Configuración de tabla</span>
      </div>
      <div class="actions">
        <button type="button" class="btn-icon" (click)="exportConfig()" title="Exportar JSON">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="7 10 12 15 17 10"></polyline>
            <line x1="12" y1="15" x2="12" y2="3"></line>
          </svg>
        </button>
        <button type="button" class="btn-icon editor-close-btn" (click)="close.emit()" title="Cerrar Editor">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
            stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
    </div>
  </div>

  <div class="wizard-progress-container">
    <div class="wizard-steps">
      <div class="wizard-progress-line-container">
        <div class="wizard-progress-bar" [style.width.%]="(currentStep() - 1) / (steps.length - 1) * 100"></div>
      </div>
      <div *ngFor="let step of steps; let i = index" 
        class="wizard-step-pill"
        [class.active]="currentStep() === i + 1"
        [class.completed]="currentStep() > i + 1"
        (click)="goToStep(i + 1)"
        [title]="step.label">
        {{ i + 1 }}
      </div>
    </div>
    <div class="wizard-step-label">
      Paso {{ currentStep() }} de {{ steps.length }}: <span class="accent-step">{{ steps[currentStep() - 1].label }}</span>
    </div>
  </div>

  <form [formGroup]="configForm" class="editor-content">
    <!-- Paso 1: Estructura Pivot -->
    <div *ngIf="currentStep() === 1" class="tab-pane">
      <div class="control-section-card">
        <div class="pivot-drag-drop">
          <div class="pivot-grid">
            <div class="pivot-section">
              <label>Columnas</label>
              <div cdkDropList #colsList="cdkDropList" [cdkDropListData]="selectedCols"
                [cdkDropListConnectedTo]="[rowsList]" class="dimension-list highlight-cols"
                (cdkDropListDropped)="drop($event)">
                <div class="dimension-box" *ngFor="let dim of selectedCols" cdkDrag>
                  {{ dim.nameView }}
                </div>
                <div class="placeholder" *ngIf="selectedCols.length === 0">
                  Arrastre columnas aquí
                </div>
              </div>
            </div>

            <div class="pivot-section">
              <label>Filas</label>
              <div cdkDropList #rowsList="cdkDropList" [cdkDropListData]="selectedRows"
                [cdkDropListConnectedTo]="[colsList]" class="dimension-list highlight-rows"
                (cdkDropListDropped)="drop($event)">
                <div class="dimension-box" *ngFor="let dim of selectedRows" cdkDrag>
                  {{ dim.nameView }}
                </div>
                <div class="placeholder" *ngIf="selectedRows.length === 0">
                  Arrastre filas aquí
                </div>
              </div>
            </div>
          </div>
          <small class="info-text">Arrastra las dimensiones para reordenar o cambiar entre filas/columnas.</small>
        </div>
      </div>
    </div>

    <!-- Paso 2: Visualización y Formato -->
    <div *ngIf="currentStep() === 2" class="tab-pane">
      <div class="control-section-card">
        <div class="form-group">
          <label>Modo Visualización</label>
          <select formControlName="valueDisplay">
            <option value="nominal">Nominal</option>
            <option value="percentOfTotal">% del Total</option>
            <option value="percentOfRow">% de Fila</option>
            <option value="percentOfColumn">% de Columna</option>
          </select>
        </div>

        <div class="form-grid-2">
          <div class="form-group">
            <label>Decimales</label>
            <input type="number" formControlName="digitsAfterDecimal" min="0" max="4" />
          </div>

          <div class="form-group">
            <label>Sufijo</label>
            <div class="input-clearable-container">
              <input type="text" formControlName="suffix" placeholder="Ej: $" />
              <button type="button" class="btn-clear" (click)="configForm.get('suffix')?.setValue('')" *ngIf="configForm.get('suffix')?.value" title="Limpiar">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                  <line x1="18" y1="6" x2="6" y2="18"></line>
                  <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Paso 3: Totales -->
    <div *ngIf="currentStep() === 3" class="tab-pane">
      <div class="control-section-card">
        <label class="switch-container">
          <span class="switch-text">Totalizar filas</span>
          <input type="checkbox" formControlName="totalRow" />
          <span class="switch-slider"></span>
        </label>
        
        <label class="switch-container">
          <span class="switch-text">Totalizar columnas</span>
          <input type="checkbox" formControlName="totalCol" />
          <span class="switch-slider"></span>
        </label>
      </div>
    </div>
  </form>

  <!-- Pie de navegación del Wizard -->
  <div class="wizard-footer">
    <button type="button" class="btn-prev" (click)="prevStep()" [disabled]="currentStep() === 1">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="15 18 9 12 15 6"></polyline>
      </svg>
      <span>Anterior</span>
    </button>
    <button type="button" class="btn-next" (click)="nextStep()">
      <span>{{ currentStep() === steps.length ? 'Finalizar' : 'Siguiente' }}</span>
      <svg *ngIf="currentStep() < steps.length" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="9 18 15 12 9 6"></polyline>
      </svg>
      <svg *ngIf="currentStep() === steps.length" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="20 6 9 17 4 12"></polyline>
      </svg>
    </button>
  </div>
</div>
